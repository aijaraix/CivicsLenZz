name: Apply producer raw-body HMAC fix

on:
  push:
    branches:
      - chatgpt/raw-body-hmac-verification

permissions:
  contents: write

jobs:
  apply-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/raw-body-hmac-verification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Apply exact tested server patch
        run: git apply --check .github/raw-auth-server.patch && git apply .github/raw-auth-server.patch
      - name: Verify raw auth regression
        run: npx tsx test/request-auth-body.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify exact source hashes
        run: |
          test "$(git hash-object server.ts)" = "ba28e511918ca139c89208837b48846981fb4184"
          test "$(git hash-object src/lib/request-auth-body.ts)" = "c1f84faebd88eb20f50ed31edbebef6fa3203435"
          test "$(git hash-object test/request-auth-body.test.ts)" = "719fd2014a9359bb878c434c6a326e2720da65ee"
          git diff --check
      - name: Commit clean verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts
          git rm .github/raw-auth-server.patch .github/workflows/apply-raw-auth-server.yml
          git commit -m "Verify producer HMAC against original JSON bytes [skip ci]"
          git push origin HEAD:chatgpt/raw-body-hmac-verification
