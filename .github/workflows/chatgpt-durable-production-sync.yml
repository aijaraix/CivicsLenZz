name: ChatGPT durable producer sync

on:
  push:
    branches:
      - chatgpt/durable-hermes-production-loop-v2

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/durable-hermes-production-loop-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact tested patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check .chatgpt/durable-production.patch; then
            git apply .chatgpt/durable-production.patch
          elif git apply --reverse --check .chatgpt/durable-production.patch; then
            echo 'Exact patch already applied.'
          else
            echo 'Patch is neither cleanly applicable nor already applied.' >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Focused durable production test
        run: npx tsx test/durable-canonical-production.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Whitespace gate
        run: git diff --check
      - name: Commit synchronized source changes
        shell: bash
        run: |
          set -euo pipefail
          git add server.ts \
            src/lib/hermes-backend-store.ts \
            src/lib/hermes-bridge-client.ts \
            src/lib/hermes-worker-daemon.ts \
            src/lib/producer-storage/postgres-producer-store.ts \
            src/lib/producer-storage/storage-interface.ts
          if git diff --cached --quiet; then
            echo 'No source commit needed.'
            exit 0
          fi
          git config user.name 'ChatGPT durable sync'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Wire canonical assignments into durable producer runtime'
          git push origin HEAD:chatgpt/durable-hermes-production-loop-v2
