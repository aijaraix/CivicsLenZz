name: R2 release gates
on:
  push:
    branches: [codex/r2-raw-storage-cutover]
permissions:
  contents: write
concurrency:
  group: r2-release-gates
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r2-raw-storage-cutover
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock R2 SDK dependencies"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/codex/r2-raw-storage-cutover
      - run: npm ci --no-audit --no-fund
      - run: npm run test:r2
      - run: npm test
      - run: npm run production:truth-audit
      - run: npm run lint
      - run: npm run build
      - name: Require unchanged source after checks
        run: git diff --exit-code -- package.json package-lock.json src server.ts test
